name: astrbot_plugin_litepoke
display_name: 轻量智能戳一戳
desc: 轻量化戳一戳插件。注册 poke_user 工具给 LLM 自主调用，配合场景引导提示，由模型判断何时戳人。
help: 提供 poke_user 工具，LLM 可自主决定是否戳指定用户。戳一戳仅 aiocqhttp 平台可用（发真实戳一戳），其他平台调用会返回不支持提示。
version: v1.6.0
author: kazamisama
repo: https://github.com/kazamisama/astrbot_plugin_litepoke
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.13.0"
